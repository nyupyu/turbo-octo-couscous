version: '3.8'

services:
  # PostgreSQL databases
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpass
      POSTGRES_DB: authdb
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d authdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  crud-db:
    image: postgres:16-alpine
    container_name: crud-db
    environment:
      POSTGRES_USER: cruduser
      POSTGRES_PASSWORD: crudpass
      POSTGRES_DB: cruddb
    volumes:
      - crud-db-data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cruduser -d cruddb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  logs-db:
    image: postgres:16-alpine
    container_name: logs-db
    environment:
      POSTGRES_USER: logsuser
      POSTGRES_PASSWORD: logspass
      POSTGRES_DB: logsdb
    volumes:
      - logs-db-data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logsuser -d logsdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend services
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://authuser:authpass@auth-db:5432/authdb
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      LOGS_SERVICE_URL: http://logs-service:3003
    depends_on:
      auth-db:
        condition: service_healthy
      logs-service:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  crud-service:
    build:
      context: ./services/crud-service
      dockerfile: Dockerfile
    container_name: crud-service
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://cruduser:crudpass@crud-db:5432/cruddb
      AUTH_SERVICE_URL: http://auth-service:3001
      LOGS_SERVICE_URL: http://logs-service:3003
    depends_on:
      crud-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      logs-service:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  logs-service:
    build:
      context: ./services/logs-service
      dockerfile: Dockerfile
    container_name: logs-service
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgresql://logsuser:logspass@logs-db:5432/logsdb
    depends_on:
      logs-db:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      CRUD_SERVICE_URL: http://crud-service:3002
      LOGS_SERVICE_URL: http://logs-service:3003
      CLIENT_URL: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - crud-service
      - logs-service
    networks:
      - backend-network
      - frontend-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: development
    container_name: client
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "5173:5173"
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
    depends_on:
      - api-gateway
    networks:
      - frontend-network
    restart: unless-stopped

networks:
  backend-network:
    driver: bridge
  frontend-network:
    driver: bridge

volumes:
  auth-db-data:
  crud-db-data:
  logs-db-data:
